# Ultralytics YOLOv8s with P2 head for small-object detection (VisDrone)
# Base architecture modified to include stride-4 (P2) feature map

# Parameters
nc: 10 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  s: [0.33, 0.50, 1024] # YOLOv8s scaling

# YOLOv8.0s backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0s head with P2
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 10
  - [[-1, 6], 1, Concat, [1]] # 11 cat backbone P4
  - [-1, 3, C2f, [512]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13
  - [[-1, 4], 1, Concat, [1]] # 14 cat backbone P3
  - [-1, 3, C2f, [256]] # 15 (P3/8-small)

  # --- P2 addition ---
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 16
  - [[-1, 2], 1, Concat, [1]] # 17 cat backbone P2
  - [-1, 3, C2f, [128]] # 18 (P2/4-tiny)

  # --- Downsampling path ---
  - [-1, 1, Conv, [128, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 cat head P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small output)

  - [-1, 1, Conv, [256, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium output)

  - [-1, 1, Conv, [512, 3, 2]] # 25
  - [[-1, 9], 1, Concat, [1]] # 26 cat head P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large output)

  - [[18, 21, 24, 27], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
