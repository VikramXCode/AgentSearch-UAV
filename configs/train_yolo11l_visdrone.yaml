# Fine-tune YOLO11l on VisDrone — optimized for small object aerial detection
# Goal: mAP@50 >= 0.50 on VisDrone2019-DET-val (548 images)

model: yolo11l.pt
data: configs/visdrone_yolo_prepared.yaml
project: runs/detect
name: yolo11l_visdrone_finetune

# Training
epochs: 100
imgsz: 1280           # Larger resolution → much better for tiny aerial objects
batch: 8              # A100 40GB handles this comfortably at 1280px
device: 0
workers: 8
seed: 42

# Convergence
patience: 20
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
warmup_epochs: 3
warmup_momentum: 0.8

# Regularisation
weight_decay: 0.0005
dropout: 0.0
label_smoothing: 0.1

# Augmentation — tuned for aerial/drone imagery
degrees: 10.0         # slight rotation (drone angle variation)
translate: 0.1
scale: 0.9            # strong scale aug → helps small objects
shear: 2.0
perspective: 0.0005
flipud: 0.1           # drones sometimes bank
fliplr: 0.5
mosaic: 1.0           # critical for small-object detection
mixup: 0.15
copy_paste: 0.3       # helps with crowded scenes
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
close_mosaic: 15      # keep mosaic until final 15 epochs

# Inference / NMS
conf: 0.001           # low conf for mAP evaluation
iou: 0.65

# Other
amp: true
plots: true
exist_ok: true
verbose: true
rect: false           # disable rect — mosaic handles variability
save_period: 10       # checkpoint every 10 epochs
